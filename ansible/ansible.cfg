[defaults]
inventory = inventory.ini
host_key_checking = False
# A freshly-created EC2 instance has a host key Ansible has never seen
# before. Disabling the check avoids an interactive yes/no prompt the first
# time you run this — reasonable for a personal learning environment;
# a real team would instead pre-seed known_hosts via the instance's
# console output instead of skipping the check entirely.
retry_files_enabled = False
